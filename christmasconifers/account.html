<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4D5D45">
  <title>Customer account</title>
  <link href="cdn/shop/t/276/assets/base1dcb.css" rel="stylesheet">
  <link href="cdn/shop/t/276/assets/custom94c5.css" rel="stylesheet">
  <style>
    body.account-page { min-height: 100vh; padding: 34px 18px; background: #f5f5ef; color: #252820; }
    .account-page main { max-width: 620px; margin: 0 auto; }
    .account-home { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; color: #42523e; font-weight: 650; text-decoration: none; }
    .account-home:hover { text-decoration: underline; text-underline-offset: 3px; }
    .account-page h1 { margin: 0 0 8px; color: #27392d; font-size: clamp(2rem, 5vw, 2.7rem); letter-spacing: -.04em; }
    .account-intro { margin: 0 0 22px; color: #687064; line-height: 1.6; }
    .account-panel { margin: 18px 0; padding: clamp(22px, 5vw, 34px); border: 1px solid #e1e4dc; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px #26352b0d; }
    .account-panel[hidden] { display: none; }
    .account-panel h2 { margin: 0 0 20px; color: #2c4031; font-size: 1.45rem; letter-spacing: -.025em; }
    .account-field { display: grid; gap: 8px; margin: 17px 0; color: #39453a; font-size: .94rem; font-weight: 600; }
    .account-field input, .account-field select { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid #cfd6cb; border-radius: 8px; background: #fff; color: #252820; font: inherit; }
    .account-field input:focus, .account-field select:focus { border-color: #4d5d45; outline: 3px solid #4d5d4526; }
    .account-phone { display: grid; grid-template-columns: minmax(150px, .8fr) 1fr; gap: 12px; }
    .account-page .button { min-height: 44px; padding: 10px 18px; border-radius: 8px; font-weight: 650; transition: transform .18s ease, box-shadow .18s ease; }
    .account-page .button:hover { transform: translateY(-1px); box-shadow: 0 5px 14px #25392c20; }
    .account-panel form > .button { width: 100%; margin-top: 4px; }
    .account-panel > p:last-child { margin: 20px 0 0; color: #626b60; }
    .account-message { min-height: 1.5em; margin: 8px 0; color: #4d5d45; font-weight: 600; }
    .account-message:empty { min-height: 0; margin: 0; }
    #profile-details { padding: 16px; border-radius: 9px; background: #f4f6f1; color: #41483f; line-height: 1.7; overflow-wrap: anywhere; }
    .account-page :focus-visible { outline: 3px solid #8ca27d; outline-offset: 3px; }
    @media (max-width: 600px) {
      body.account-page { padding: 22px 14px; }
      .account-home { margin-bottom: 18px; }
      .account-phone { grid-template-columns: 1fr; }
      .account-panel { padding: 22px 18px; }
    }
  </style>
</head>
<body class="account-page">
  <main>
    <a class="account-home" href="index.html">← Store home</a>
    <h1>Customer account</h1>
    <p class="account-intro">Sign in or create an account to manage your details with Carol's Christmas Conifers.</p>
    <p class="account-message" id="account-message" role="status" aria-live="polite"></p>
    <section class="account-panel" id="sign-in-panel">
      <h2>Sign in</h2>
      <form id="sign-in-form">
        <label class="account-field">Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label class="account-field">Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="button button--primary" type="submit">Sign in</button>
      </form>
      <p>New here? <button class="button button--secondary" id="show-register" type="button">Create an account</button></p>
    </section>

    <section class="account-panel" id="register-panel" hidden>
      <h2>Create an account</h2>
      <form id="register-form">
        <label class="account-field">Full name
          <input name="name" autocomplete="name" maxlength="120" required>
        </label>
        <label class="account-field">Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label class="account-field">Password (at least 10 characters)
          <input name="password" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <label class="account-field">Country or region
          <select name="country" id="country" required>
            <option value="United States" data-code="+1" data-flag="🇺🇸">🇺🇸 United States (+1)</option>
            <option value="Canada" data-code="+1" data-flag="🇨🇦">🇨🇦 Canada (+1)</option>
            <option value="United Kingdom" data-code="+44" data-flag="🇬🇧">🇬🇧 United Kingdom (+44)</option>
            <option value="Australia" data-code="+61" data-flag="🇦🇺">🇦🇺 Australia (+61)</option>
            <option value="New Zealand" data-code="+64" data-flag="🇳🇿">🇳🇿 New Zealand (+64)</option>
            <option value="Ireland" data-code="+353" data-flag="🇮🇪">🇮🇪 Ireland (+353)</option>
            <option value="France" data-code="+33" data-flag="🇫🇷">🇫🇷 France (+33)</option>
            <option value="Germany" data-code="+49" data-flag="🇩🇪">🇩🇪 Germany (+49)</option>
            <option value="Italy" data-code="+39" data-flag="🇮🇹">🇮🇹 Italy (+39)</option>
            <option value="Spain" data-code="+34" data-flag="🇪🇸">🇪🇸 Spain (+34)</option>
            <option value="Portugal" data-code="+351" data-flag="🇵🇹">🇵🇹 Portugal (+351)</option>
            <option value="Netherlands" data-code="+31" data-flag="🇳🇱">🇳🇱 Netherlands (+31)</option>
            <option value="Belgium" data-code="+32" data-flag="🇧🇪">🇧🇪 Belgium (+32)</option>
            <option value="Switzerland" data-code="+41" data-flag="🇨🇭">🇨🇭 Switzerland (+41)</option>
            <option value="Austria" data-code="+43" data-flag="🇦🇹">🇦🇹 Austria (+43)</option>
            <option value="Sweden" data-code="+46" data-flag="🇸🇪">🇸🇪 Sweden (+46)</option>
            <option value="Norway" data-code="+47" data-flag="🇳🇴">🇳🇴 Norway (+47)</option>
            <option value="Denmark" data-code="+45" data-flag="🇩🇰">🇩🇰 Denmark (+45)</option>
            <option value="Finland" data-code="+358" data-flag="🇫🇮">🇫🇮 Finland (+358)</option>
            <option value="Poland" data-code="+48" data-flag="🇵🇱">🇵🇱 Poland (+48)</option>
            <option value="Czechia" data-code="+420" data-flag="🇨🇿">🇨🇿 Czechia (+420)</option>
            <option value="Greece" data-code="+30" data-flag="🇬🇷">🇬🇷 Greece (+30)</option>
            <option value="Romania" data-code="+40" data-flag="🇷🇴">🇷🇴 Romania (+40)</option>
            <option value="Turkey" data-code="+90" data-flag="🇹🇷">🇹🇷 Turkey (+90)</option>
            <option value="Ukraine" data-code="+380" data-flag="🇺🇦">🇺🇦 Ukraine (+380)</option>
            <option value="Russia" data-code="+7" data-flag="🇷🇺">🇷🇺 Russia (+7)</option>
            <option value="Japan" data-code="+81" data-flag="🇯🇵">🇯🇵 Japan (+81)</option>
            <option value="China" data-code="+86" data-flag="🇨🇳">🇨🇳 China (+86)</option>
            <option value="India" data-code="+91" data-flag="🇮🇳">🇮🇳 India (+91)</option>
            <option value="Pakistan" data-code="+92" data-flag="🇵🇰">🇵🇰 Pakistan (+92)</option>
            <option value="Bangladesh" data-code="+880" data-flag="🇧🇩">🇧🇩 Bangladesh (+880)</option>
            <option value="Philippines" data-code="+63" data-flag="🇵🇭">🇵🇭 Philippines (+63)</option>
            <option value="Singapore" data-code="+65" data-flag="🇸🇬">🇸🇬 Singapore (+65)</option>
            <option value="Malaysia" data-code="+60" data-flag="🇲🇾">🇲🇾 Malaysia (+60)</option>
            <option value="Indonesia" data-code="+62" data-flag="🇮🇩">🇮🇩 Indonesia (+62)</option>
            <option value="Thailand" data-code="+66" data-flag="🇹🇭">🇹🇭 Thailand (+66)</option>
            <option value="Vietnam" data-code="+84" data-flag="🇻🇳">🇻🇳 Vietnam (+84)</option>
            <option value="South Korea" data-code="+82" data-flag="🇰🇷">🇰🇷 South Korea (+82)</option>
            <option value="United Arab Emirates" data-code="+971" data-flag="🇦🇪">🇦🇪 United Arab Emirates (+971)</option>
            <option value="Saudi Arabia" data-code="+966" data-flag="🇸🇦">🇸🇦 Saudi Arabia (+966)</option>
            <option value="South Africa" data-code="+27" data-flag="🇿🇦">🇿🇦 South Africa (+27)</option>
            <option value="Nigeria" data-code="+234" data-flag="🇳🇬">🇳🇬 Nigeria (+234)</option>
            <option value="Kenya" data-code="+254" data-flag="🇰🇪">🇰🇪 Kenya (+254)</option>
            <option value="Ghana" data-code="+233" data-flag="🇬🇭">🇬🇭 Ghana (+233)</option>
            <option value="Egypt" data-code="+20" data-flag="🇪🇬">🇪🇬 Egypt (+20)</option>
            <option value="Brazil" data-code="+55" data-flag="🇧🇷">🇧🇷 Brazil (+55)</option>
            <option value="Mexico" data-code="+52" data-flag="🇲🇽">🇲🇽 Mexico (+52)</option>
            <option value="Argentina" data-code="+54" data-flag="🇦🇷">🇦🇷 Argentina (+54)</option>
            <option value="Chile" data-code="+56" data-flag="🇨🇱">🇨🇱 Chile (+56)</option>
            <option value="Colombia" data-code="+57" data-flag="🇨🇴">🇨🇴 Colombia (+57)</option>
            <option value="Jamaica" data-code="+1" data-flag="🇯🇲">🇯🇲 Jamaica (+1)</option>
            <option value="Other" data-code="+" data-flag="🌐">🌐 Other (enter calling code)</option>
          </select>
        </label>
        <div class="account-phone">
          <label class="account-field">Flag and country code
            <input name="countryCode" id="country-code" value="+1" inputmode="tel" pattern="\+[0-9]{1,4}" required>
          </label>
          <label class="account-field">Phone number
            <input name="phone" type="tel" autocomplete="tel-national" inputmode="tel" required>
          </label>
        </div>
        <button class="button button--primary" type="submit">Create account</button>
      </form>
      <p>Already registered? <button class="button button--secondary" id="show-login" type="button">Sign in</button></p>
    </section>

    <section class="account-panel" id="profile-panel" hidden>
      <h2>Your account</h2>
      <p id="profile-details"></p>
      <button class="button button--secondary" id="sign-out" type="button">Sign out</button>
    </section>
  </main>
  <script>
    const message = document.querySelector('#account-message');
    const signIn = document.querySelector('#sign-in-panel');
    const register = document.querySelector('#register-panel');
    const profile = document.querySelector('#profile-panel');
    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `Request failed (${response.status}).`);
      return result;
    }
    function showError(error) { message.textContent = error.message; }
    function showAccount(account) {
      signIn.hidden = true;
      register.hidden = true;
      profile.hidden = false;
      document.querySelector('#profile-details').textContent =
        `${account.name} · ${account.email} · ${account.countryCode} ${account.phone}`;
    }
    document.querySelector('#show-register').addEventListener('click', () => {
      signIn.hidden = true;
      register.hidden = false;
      message.textContent = '';
    });
    document.querySelector('#show-login').addEventListener('click', () => {
      register.hidden = true;
      signIn.hidden = false;
      message.textContent = '';
    });
    document.querySelector('#country').addEventListener('change', (event) => {
      const selected = event.currentTarget.selectedOptions[0];
      document.querySelector('#country-code').value = selected.dataset.code || '+';
    });
    document.querySelector('#sign-in-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const values = Object.fromEntries(new FormData(event.currentTarget));
      try {
        const result = await request('/api/account/login', { method: 'POST', body: JSON.stringify(values) });
        showAccount(result.account);
        message.textContent = 'Signed in.';
      } catch (error) { showError(error); }
    });
    document.querySelector('#register-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const values = Object.fromEntries(new FormData(event.currentTarget));
      try {
        const result = await request('/api/account/register', { method: 'POST', body: JSON.stringify(values) });
        showAccount(result.account);
        message.textContent = 'Account created.';
      } catch (error) { showError(error); }
    });
    document.querySelector('#sign-out').addEventListener('click', async () => {
      try {
        await request('/api/account/logout', { method: 'POST', body: '{}' });
        profile.hidden = true;
        signIn.hidden = false;
        message.textContent = 'Signed out.';
      } catch (error) { showError(error); }
    });
    request('/api/account/me').then(({ account }) => showAccount(account)).catch((error) => {
      if (!error.message.includes('Sign in to continue')) showError(error);
    });
  </script>
</body>
</html>
